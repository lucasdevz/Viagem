<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicativo de consumo de combustivel</title>
    <link rel="shortcut icon" href="image/biofuel_fuel_station_petrol_green_energy_ecology_icon_191956.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="central">
        <input type="text" id="distancia" placeholder="digite a distancia para o destino">
        <input type="text" id="consumo" placeholder="digite o consumo em KM/L do seu veiculo">
        <input type="text" id="preco" placeholder="digite o preço atual do combustivel">
        <button id="btcalcular">Calcular</button>
        <p id="resultado"></p>

    </div>


<script src="js/script.js"></script>
</body>
</html>
